name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing project version to publish (X.Y.Z)"
        required: true
        type: string
      expected_sha:
        description: "Exact main commit validated by dry-run"
        required: true
        type: string
      dry_run:
        description: "Run all checks without creating or publishing a Release"
        required: true
        default: true
        type: boolean

concurrency:
  group: rvtf-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.preflight.outputs.sha }}
    steps:
      - name: Check out main at full depth
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install CI dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate release identity
        id: preflight
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_SHA}"
          python scripts/release.py --root . version --check "${RELEASE_VERSION}"
          python scripts/release.py --root . notes "${RELEASE_VERSION}" > release-notes.md
          printf 'sha=%s\n' "${actual_sha}" >> "${GITHUB_OUTPUT}"

      - name: Run the full release candidate gate
        run: ./scripts/ci.sh

      - name: Stage candidate artifacts
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          cp "dist/rvtf-skills-${RELEASE_VERSION}.tgz" release-candidate/
          cp dist/SHA256SUMS release-candidate/
          cp release-notes.md release-candidate/

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rvtf-release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: ${{ !inputs.dry_run && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Download candidate artifacts
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rvtf-release-candidate
          path: release-candidate

      - name: Configure release tools
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -f "release-candidate/rvtf-skills-${RELEASE_VERSION}.tgz"
          test -f release-candidate/SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or verify immutable tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || true
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "${tag}")"
            test "${tag_sha}" = "${EXPECTED_SHA}"
          else
            git tag -a "${tag}" "${EXPECTED_SHA}" -m "RVTF Skills ${tag}"
            git push origin "${tag}"
          fi

      - name: Create or inspect GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          title="RVTF Skills v${RELEASE_VERSION}"
          archive="release-candidate/rvtf-skills-${RELEASE_VERSION}.tgz"
          release_json="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,name,assets 2>/dev/null || true)"

          if [[ -z "${release_json}" ]]; then
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "${title}" \
              --notes-file release-candidate/release-notes.md
            release_json="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft,name,assets)"
          fi

          release_name="$(jq -r '.name' <<<"${release_json}")"
          is_draft="$(jq -r '.isDraft' <<<"${release_json}")"
          test "${release_name}" = "${title}"
          if [[ "${is_draft}" = "true" ]]; then
            gh release upload "${tag}" "${archive}" release-candidate/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
          else
            archive_digest="sha256:$(shasum -a 256 "${archive}" | awk '{print $1}')"
            sums_digest="sha256:$(shasum -a 256 release-candidate/SHA256SUMS | awk '{print $1}')"
            release_json="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets)"
            test "$(jq -r --arg name "$(basename "${archive}")" '.assets[] | select(.name == $name) | .digest' <<<"${release_json}")" = "${archive_digest}"
            test "$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .digest' <<<"${release_json}")" = "${sums_digest}"
          fi

      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          verify_dir="$(mktemp -d)"
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir "${verify_dir}"
          (cd "${verify_dir}" && shasum -a 256 -c SHA256SUMS)
