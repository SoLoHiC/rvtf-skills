schema_version: "0.4.0"
scope:
  id: fixture:v0.4-registry
  title: Operational Economy registry contract
  mode: strict
  sources:
    - docs/design/operational-economy.md

delivery_scopes:
  - scope_ref: goal:operational-economy
    scope_kind: goal
    host_kind: release-objective
    host_ref: host-goal:oe-fixture
    required_child_inventory_revision: sha256:goal-inventory-v1
    required_child_scope_refs:
      - milestone:operational-economy
    disposition: incomplete

  - scope_ref: milestone:operational-economy
    scope_kind: milestone
    host_kind: implementation-phase
    parent_scope_ref: goal:operational-economy
    required_for_parent: true
    required_child_inventory_revision: sha256:milestone-inventory-v2
    required_child_scope_refs:
      - unit:evidence-contract
      - unit:schema-validator
    disposition: incomplete

  - scope_ref: unit:evidence-contract
    scope_kind: unit
    host_kind: task
    parent_scope_ref: milestone:operational-economy
    required_for_parent: true
    host_status: done
    disposition: complete

  - scope_ref: unit:schema-validator
    scope_kind: unit
    host_kind: task
    parent_scope_ref: milestone:operational-economy
    required_for_parent: true
    host_status: planned
    disposition: incomplete

delivery_groups:
  - group_ref: execution-group:operational-economy-wave-1
    group_kind: execution_batch
    host_kind: implementation-wave
    member_scope_refs:
      - unit:evidence-contract
      - unit:schema-validator

requirements:
  - id: OE-FIXTURE-001
    capability: reusable evidence contracts
    type: behavior
    source: docs/design/operational-economy.md#registry
    validity:
      status: accepted
      owner: fixture-owner
      rationale: Registry evidence is required for this strict fixture.
    statement: One artifact can prove a canonical Item and a Journey through separate claims.
    acceptance:
      - id: OE-FIXTURE-001-AI-001
        criterion: The registry receipt proves the target-specific Item behavior.
        source_ref:
          path: docs/design/operational-economy.md
          anchor: registry
          revision: sha256:criterion-v1
        verification:
          method: automated-test
          command: python3 tests/registry_contract.py
          expected: exits 0 with target-specific registry claims
        status: verified
        evidence:
          - evidence_ref: EC-OE-ITEM-001
        gaps: []
    status: verified
    gaps: []

journey_applicability:
  scope_ref: unit:evidence-contract
  decision: required
  rationale: The actor must complete an ordered path and reach a declared outcome.
  triggers:
    - ordered observable steps
    - item evidence alone cannot prove the expected outcome

journeys:
  - id: J-OE-FIXTURE-001
    name: Validate a reusable evidence contract
    actor: fixture-runner
    goal: Validate the Item and its connected path from one receipt.
    expected_outcome: Both target-specific claims are checked without copying evidence metadata.
    steps:
      - id: J-OE-FIXTURE-001-S1
        observable_outcome: The registry contract is validated.
        acceptance_item_ids:
          - OE-FIXTURE-001-AI-001
    path_evidence:
      - evidence_ref: EC-OE-JOURNEY-001
    status: verified
    gaps: []

evidence_artifacts:
  - id: EA-OE-SHARED-001
    kind: test-receipt
    locator: artifacts/registry-contract.json
    generated_at: 2026-08-05T10:00:00Z
    subject_revision: abc123
    verifier_ref: test:registry-contract
    verifier_revision: sha256:verifier-v1
    dependency_fingerprint: sha256:relevant-inputs-v1
    environment_fingerprint: python3.13-pyyaml6-linux
    command_signature: python3 tests/registry_contract.py
    result: passed

evidence_claims:
  - id: EC-OE-ITEM-001
    artifact_ref: EA-OE-SHARED-001
    target_kind: acceptance_item
    target_ref: OE-FIXTURE-001-AI-001
    proves: The registry receipt proves the target-specific Item behavior.
    coverage:
      - registry-item-contract
    normal_gate: true
    validity:
      status: valid
      assessment_ref: EVA-OE-ITEM-001
      checked_against_revision: def456
      invalidation_triggers:
        - target_changed
        - verifier_changed
        - dependency_fingerprint_changed

  - id: EC-OE-JOURNEY-001
    artifact_ref: EA-OE-SHARED-001
    target_kind: journey
    target_ref: J-OE-FIXTURE-001
    proves: The fixture runner validates the registry contract and reaches the expected outcome.
    covers_steps:
      - J-OE-FIXTURE-001-S1
    proves_order: true
    proves_outcome: true
    normal_gate: true
    validity:
      status: valid
      assessment_ref: EVA-OE-JOURNEY-001
      checked_against_revision: def456
      invalidation_triggers:
        - target_changed
        - verifier_changed
        - dependency_fingerprint_changed

evidence_validity_assessments:
  - id: EVA-OE-ITEM-001
    claim_ref: EC-OE-ITEM-001
    from_revision: abc123
    checked_against_revision: def456
    assessed_at: 2026-08-05T11:00:00Z
    assessor_ref: host:affected-graph
    policy_ref: verification-policy:operational-economy
    basis:
      target_revision_before: sha256:criterion-v1
      target_revision_after: sha256:criterion-v1
      verifier_revision_before: sha256:verifier-v1
      verifier_revision_after: sha256:verifier-v1
      dependency_fingerprint_before: sha256:relevant-inputs-v1
      dependency_fingerprint_after: sha256:relevant-inputs-v1
      environment_compatibility: compatible
      freshness: within_policy
      rationale: Only unrelated documentation changed between the two revisions.
    decision: valid

  - id: EVA-OE-JOURNEY-001
    claim_ref: EC-OE-JOURNEY-001
    from_revision: abc123
    checked_against_revision: def456
    assessed_at: 2026-08-05T11:00:00Z
    assessor_ref: host:affected-graph
    policy_ref: verification-policy:operational-economy
    basis:
      target_revision_before: sha256:journey-v1
      target_revision_after: sha256:journey-v1
      verifier_revision_before: sha256:verifier-v1
      verifier_revision_after: sha256:verifier-v1
      dependency_fingerprint_before: sha256:relevant-inputs-v1
      dependency_fingerprint_after: sha256:relevant-inputs-v1
      environment_compatibility: compatible
      freshness: within_policy
      rationale: The Journey, verifier, relevant inputs, and environment remain applicable.
    decision: valid

verification_policy:
  id: verification-policy:operational-economy
  scope_ref: milestone:operational-economy
  host_native_required_gates:
    - gate_ref: host:test-current-tree
      lifecycle_boundary: task_completion
      freshness: current_tree
  tiers:
    worker:
      trigger: affected_unit_change
      command_refs:
        - test:registry-targeted
    batch:
      trigger: batch_ready_or_shared_dependency_change
      command_refs:
        - test:registry-affected
    milestone:
      trigger: milestone_closure
      command_refs:
        - test:registry-integration
    completion:
      trigger: goal_closure
      command_refs:
        - trace:completion-audit
        - test:repository-full
  reuse_policy: reuse_valid_claims_then_run_missing_gates

host_gate_receipts:
  - id: HGR-OE-CURRENT-TREE-001
    gate_ref: host:test-current-tree
    lifecycle_boundary: task_completion
    subject_revision: def456
    executed_at: 2026-08-05T11:30:00Z
    command_signature: python3 tests/registry_contract.py --current-tree
    freshness: current_tree
    status: passed
    current_test_status_claim: passed

review_applicability:
  scope_ref: milestone:operational-economy
  decision: required
  mode: independent
  rationale: Strict cross-revision evidence reuse requires independent review coverage.

review_contract:
  id: RC-OE-001
  scope_ref: milestone:operational-economy
  cadence: milestone
  child_scope_policy: covered_at_parent
  covered_child_scope_refs:
    - unit:evidence-contract
  batch_combination_policy: combined_allowed
  host_native_required_batches:
    - host:task-review
  independence:
    required: true
  dimensions:
    baseline:
      - requirement-fidelity
      - impact-and-ownership
      - verification-and-closure
    triggered:
      - trust-security-and-privacy
  expected_batches:
    - id: security-review
      host_kind: specialist-review
      dimensions:
        - trust-security-and-privacy

review_epochs:
  - id: RE-OE-001
    contract: RC-OE-001
    subject_refs:
      - kind: git-commit
        ref: repository
        revision: abc123
    status: closed

  - id: RE-OE-002
    contract: RC-OE-001
    prior_epoch: RE-OE-001
    subject_refs:
      - kind: git-commit
        ref: repository
        revision: def456
    status: closed

review_batches:
  - id: RB-OE-SECURITY-001
    epoch: RE-OE-001
    host_kind: specialist-review
    subject_refs:
      - kind: git-commit
        ref: repository
        revision: abc123
    reviewer:
      role: security-reviewer
      relationship_to_implementer: independent
      reviewer_ref: reviewer:security-001
    dimension_coverage:
      - dimension: requirement-fidelity
        status: covered
        findings: []
      - dimension: impact-and-ownership
        status: covered
        findings: []
      - dimension: verification-and-closure
        status: covered
        findings: []
      - dimension: trust-security-and-privacy
        status: covered
        findings: []
    coverage_status: complete
    limitations: []

  - id: RB-OE-HOST-TASK-001
    epoch: RE-OE-002
    host_kind: task-review
    host_batch_ref: host:task-review
    subject_refs:
      - kind: git-commit
        ref: repository
        revision: def456
    reviewer:
      role: task-reviewer
      relationship_to_implementer: independent
      reviewer_ref: reviewer:task-001
    dimension_coverage:
      - dimension: requirement-fidelity
        status: covered
        findings: []
      - dimension: impact-and-ownership
        status: covered
        findings: []
      - dimension: verification-and-closure
        status: covered
        findings: []
    coverage_status: complete
    limitations: []

review_impact_assessments:
  - id: RIA-OE-001
    source_batch_ref: RB-OE-SECURITY-001
    from_revision: abc123
    to_revision: def456
    changed_surface:
      - documentation-only
    unchanged_dimensions:
      - trust-security-and-privacy
    rationale: The remediation revision does not change the reviewed security surface.
    assessor_ref: reviewer:security-001
    decision: accepted

review_coverage_carry_forward:
  - id: RCF-OE-001
    source_batch_ref: RB-OE-SECURITY-001
    target_epoch: RE-OE-002
    from_revision: abc123
    to_revision: def456
    unchanged_dimensions:
      - trust-security-and-privacy
    impact_assessment_ref: RIA-OE-001
    assessor_ref: reviewer:security-001
    decision: accepted

closure_packet:
  scope_ref: unit:evidence-contract
  subject_revision: def456
  disposition: complete
  host_gate_status:
    - gate_ref: host:test-current-tree
      receipt_ref: HGR-OE-CURRENT-TREE-001
      status: satisfied
      subject_revision: def456
  review_closure:
    epoch: RE-OE-002
    subject_refs:
      - kind: git-commit
        ref: repository
        revision: def456
    status: closed
    accepted_batches:
      - RB-OE-HOST-TASK-001
    accepted_carry_forward:
      - RCF-OE-001
    remaining_late_findings: []
  continuation:
    parent_scope_ref: milestone:operational-economy
    parent_disposition: incomplete
    continuation_mode: artifact_only
    authority_ref: rvtf:goal-operational-economy
    resume_locator: docs/delivery/operational-economy.yaml
    remaining_scope_refs:
      - unit:schema-validator
    next_entry_conditions:
      - Begin the schema validator after the evidence contract is accepted.
    execution_action: stop
    stop_basis: host_command_completed

gaps: []
review_findings: []
scope_amendments: []
